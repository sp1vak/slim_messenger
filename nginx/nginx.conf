# nginx/nginx.conf

# Системний блок (обов'язковий для головного конфігу)
events {
    worker_connections 1024;
}

# Глобальний веб-блок, всередині якого живе наш додаток
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream django_app {
        # 'web' — це назва сервісу твого Django-контейнера в docker-compose.yml
        server web:8000; 
    }

    server {
        listen 80;
        server_name localhost;

        # Максимальний розмір файлів для завантаження (наприклад, для аватарів)
        client_max_body_size 10M;

        # 1. Роздача статики
        location /static/ {
            alias /app/static/;
        }

        # 2. Роздача медіа (аватари користувачів)
        location /media/ {
            alias /app/media/;
        }

        # 3. Обробка WebSockets (для чату)
        location /ws/ {
            proxy_pass http://django_app;
            
            # Ці заголовки обов'язкові, щоб Nginx не обривав WebSocket з'єднання
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        # 4. Обробка звичайних HTTP запитів
        location / {
            proxy_pass http://django_app;
            
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
    }
}